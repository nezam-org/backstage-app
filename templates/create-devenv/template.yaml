apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: create-devenv
  title: Request a dev environment
  description: >-
    A personal cloud workspace: VS Code (code-server) in the browser + SSH
    from your terminal, with a real toolchain preinstalled (claude, pi,
    kubectl, k9s, tofu, flux, helm, gh, lazygit, LazyVim, tmux, zsh) and
    optional full Docker (build/run/compose — no privileged pod). Your
    home dir persists on disk; the workspace suspends after ~2h idle and
    wakes on access. NO GitHub repo is created. The image ships the platform
    owner's generic dotfiles as defaults — change anything once inside;
    bring-your-own-dotfiles is planned.
  tags:
    - devenv
    - workspace
spec:
  owner: ma-shaaban
  type: resource

  # ---------------------------------------------------------------------------
  # FORM
  # ---------------------------------------------------------------------------
  parameters:
    - title: Your dev workspace
      required:
        - envName
        - size
        - pvcSize
      properties:
        envName:
          title: Workspace name
          type: string
          description: >-
            Short name (e.g. "main"). Becomes your URLs:
            <you>-<name>-dev.nezam.site (web IDE) and
            <you>-<name>-ssh.nezam.site (SSH). One environment per user.
          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
          maxLength: 16
          default: main
          ui:autofocus: true
        size:
          title: Size
          type: string
          default: M
          enum: [S, M]
          enumNames:
            - 'S — 0.5 vCPU / 1 GiB (light editing)'
            - 'M — 1 vCPU / 2 GiB (recommended)'
          description: >-
            L (2 vCPU / 4 GiB) coming soon — needs more cluster capacity.
          ui:widget: radio
        pvcSize:
          title: Disk (home directory)
          type: string
          default: 10Gi
          enum: [5Gi, 10Gi, 20Gi]
          ui:widget: radio
        webIde:
          title: Web IDE (VS Code in the browser)
          type: boolean
          default: true
          description: >-
            OFF = terminal-first — saves ~500 MB RAM while awake; the web URL
            shows connection instructions instead and you work over SSH
            (tmux + LazyVim preinstalled). Extensions below are ignored when
            off.
        extensions:
          title: VS Code extensions (Open VSX)
          description: >-
            Preinstalled at first boot. You can install more inside the IDE —
            they persist on your disk.
          type: array
          uniqueItems: true
          ui:widget: checkboxes
          default:
            - ms-python.python
            - charliermarsh.ruff
            - redhat.vscode-yaml
            - eamodio.gitlens
          items:
            type: string
            enum:
              - ms-python.python
              - charliermarsh.ruff
              - dbaeumer.vscode-eslint
              - esbenp.prettier-vscode
              - redhat.vscode-yaml
              - ms-azuretools.vscode-docker
              - eamodio.gitlens
              - golang.go
              - rust-lang.rust-analyzer
              - ms-toolsai.jupyter
        ssh:
          title: Enable SSH access
          type: boolean
          default: true
          description: >-
            SSH from your own terminal, tunneled over 443 — auth via your
            GitHub public keys (github.com/<you>.keys must be non-empty).
            Connecting auto-wakes a suspended workspace.
        docker:
          title: Enable Docker
          type: boolean
          default: false
          description: >-
            Full Docker inside the workspace — build, run, compose, even
            kind/rootless — no privileged pod (sysbox runtime; the workspace
            runs on the sysbox-capable node). Also enables VPN clients
            (a /dev/net/tun device + NET_ADMIN, scoped to the pod). Docker
            images/containers do NOT survive suspend (your home dir does).
            Builds are hungry: pick size M.
    - title: Backup (bring your own bucket — optional but recommended)
      description: >-
        Backups go to YOUR OWN S3-compatible bucket (Backblaze B2, AWS S3,
        Cloudflare R2, MinIO…) — your storage, your control. Leave the fields
        blank to run without backup. IMPORTANT: the workspace disk is pinned
        to one server node; without backup, losing that node loses your home
        dir. Backup also powers the close → re-request → auto-restore loop.
      properties:
        backupProvider:
          title: Storage provider
          type: string
          default: Backblaze B2
          enum: [Backblaze B2, AWS S3, Cloudflare R2, Other S3-compatible]
          description: >-
            Just shapes the endpoint hint below — any S3-compatible store works.
        backupEndpoint:
          title: S3 endpoint (host, no https://)
          type: string
          description: >-
            B2 → s3.<region>.backblazeb2.com · AWS → s3.<region>.amazonaws.com
            · R2 → <account>.r2.cloudflarestorage.com. Leave blank for no backup.
        backupRegion:
          title: Region
          type: string
          description: 'e.g. eu-central-003 (B2) or us-east-1 (AWS). Optional for B2.'
        backupBucket:
          title: Bucket name
          type: string
          description: 'Your existing bucket (e.g. mahmoud-dev-state).'
        backupPrefix:
          title: Repo path/prefix (advanced)
          type: string
          description: >-
            Where in the bucket this env's restic repo lives. Default
            workspace/<you>-<env>. Reopen the SAME env name + same restic
            password to auto-restore. Coexists with other data in the bucket.
        backupAccessKey:
          title: S3 Access Key ID
          type: string
          ui:field: SecretText
          ui:options:
            secretKey: BACKUP_ACCESS_KEY
        backupSecretKey:
          title: S3 Secret Access Key
          type: string
          ui:field: SecretText
          ui:options:
            secretKey: BACKUP_SECRET_KEY
        resticPassword:
          title: Restic repository password
          type: string
          ui:field: SecretText
          ui:options:
            secretKey: BACKUP_RESTIC_PASSWORD
          description: >-
            Encrypts your backup. SAVE IT — you need the SAME password to
            restore later (e.g. when you reopen this env). Leave blank and one
            is generated + shown once on the next screen.

  # ---------------------------------------------------------------------------
  # STEPS
  # ---------------------------------------------------------------------------
  steps:
    # 0. ONE env per user (050 D5) — server-side against the LIVE platform
    #    tree; the form/catalog can't be trusted for this.
    - id: assert-single-env
      name: Check you have no existing environment
      action: nezam:devenv:assert-none
      input:
        user: ${{ user.entity.metadata.name }}

    # 1. Fetch the devenv skeleton VERBATIM from the platform repo (literal
    #    __TOKENS__, fetch:plain does not run nunjucks on contents). Read via
    #    the bot App integration. Everything under ./pr lands at the platform
    #    repo root in one PR.
    - id: fetch-skeleton
      name: Fetch the devenv skeleton
      action: fetch:plain
      input:
        url: https://github.com/nezam-org/nezam-devops-k3s/tree/main/templates/devenv
        targetPath: ./pr/k8s/devenvs/${{ user.entity.metadata.name }}/${{ parameters.envName }}

    # 2. Stamp it. Size presets map inline (S: 100m/500m/512Mi/1Gi,
    #    M: 250m/1/1Gi/2Gi — 050 §4). The image tag is pinned here and bumped
    #    on workspace-image releases.
    - id: personalise
      name: Personalise the environment
      action: nezam:fs:replace
      input:
        globPattern: pr/**/*
        replacements:
          - find: __NAMESPACE__
            replaceWith: ${{ user.entity.metadata.name }}-${{ parameters.envName }}-dev
          - find: __USER__
            replaceWith: ${{ user.entity.metadata.name }}
          - find: __ENV__
            replaceWith: ${{ parameters.envName }}
          - find: __CPU_REQUEST__
            replaceWith: ${{ '100m' if parameters.size == 'S' else '250m' }}
          - find: __CPU_LIMIT__
            replaceWith: ${{ '500m' if parameters.size == 'S' else '1' }}
          - find: __MEM_REQUEST__
            replaceWith: ${{ '512Mi' if parameters.size == 'S' else '1Gi' }}
          - find: __MEM_LIMIT__
            replaceWith: ${{ '1Gi' if parameters.size == 'S' else '2Gi' }}
          - find: __PVC_SIZE__
            replaceWith: ${{ parameters.pvcSize }}
          - find: __IMAGE_TAG__
            replaceWith: main-1cd70df
          - find: __WEB_IDE__
            replaceWith: ${{ 'true' if parameters.webIde else 'false' }}
          # docker (050 F1) is STRUCTURAL, not env-only: sysbox runtime +
          # kubelet user namespaces (required pair) + a userns-root container
          # start (the entrypoint runs dockerd then drops to dev). Docker OFF
          # renders the pre-docker manifest byte-identical.
          - find: __SYSBOX_RUNTIME__
            replaceWith: "${{ 'runtimeClassName: sysbox-runc' if parameters.docker else '' }}"
          - find: __HOST_USERS__
            replaceWith: ${{ 'false' if parameters.docker else 'true' }}
          - find: __RUN_AS_NON_ROOT__
            replaceWith: ${{ 'false' if parameters.docker else 'true' }}
          - find: __RUN_AS_USER__
            replaceWith: ${{ '0' if parameters.docker else '1000' }}
          - find: __ALLOW_PRIVESC__
            replaceWith: ${{ 'true' if parameters.docker else 'false' }}
          - find: __CAPS_DROP__
            replaceWith: ${{ '' if parameters.docker else 'ALL' }}
          - find: __DOCKER__
            replaceWith: ${{ 'true' if parameters.docker else 'false' }}
          # docker adds NET_ADMIN + a /dev/net/tun bind-mount (flow-style, one
          # gated token each) so in-workspace VPN clients can create a tun
          # device; empty when docker off.
          - find: __CAPS_ADD__
            replaceWith: ${{ 'NET_ADMIN' if parameters.docker else '' }}
          - find: __DOCKER_TUN_MOUNT__
            replaceWith: "${{ '- {name: tun, mountPath: /dev/net/tun}' if parameters.docker else '' }}"
          - find: __DOCKER_TUN_VOLUME__
            replaceWith: "${{ '- {name: tun, hostPath: {path: /dev/net/tun, type: CharDevice}}' if parameters.docker else '' }}"
          - find: __EXTENSIONS__
            replaceWith: ${{ parameters.extensions | join(' ') }}
          - find: __SSH_ENABLED__
            replaceWith: ${{ 'true' if parameters.ssh else 'false' }}
          # backup nightly loop runs only when a bucket was provided
          - find: __BACKUP_ENABLED__
            replaceWith: ${{ 'true' if (parameters.backupBucket and parameters.backupEndpoint) else 'false' }}

    # 3. Generate + seal the env secrets (050 D15/F2, ADR-027): web password is
    #    argon2id-hashed for code-server; the user's OWN S3 backup credentials
    #    (keys + restic password via SecretText → scaffolder secrets, never in
    #    the task record) are sealed alongside. Plaintext web + generated restic
    #    passwords appear ONLY on this run's output page.
    - id: seal-secrets
      name: Generate the workspace credentials (encrypted)
      action: nezam:devenv:seal-secrets
      input:
        user: ${{ user.entity.metadata.name }}
        env: ${{ parameters.envName }}
        namespace: ${{ user.entity.metadata.name }}-${{ parameters.envName }}-dev
        ageRecipient: age14w6krfhmhpdfysedvennwf63d04ffp2w9h0uap3ax02xkrz4zcmq9hsmt0
        secretsPath: pr/k8s/devenvs/${{ user.entity.metadata.name }}/${{ parameters.envName }}/secrets.sops.yaml
        backupEndpoint: ${{ parameters.backupEndpoint }}
        backupRegion: ${{ parameters.backupRegion }}
        backupBucket: ${{ parameters.backupBucket }}
        backupPrefix: ${{ parameters.backupPrefix }}
        backupAccessKey: ${{ secrets.BACKUP_ACCESS_KEY }}
        backupSecretKey: ${{ secrets.BACKUP_SECRET_KEY }}
        resticPassword: ${{ secrets.BACKUP_RESTIC_PASSWORD }}

    # 4. One PR onto the platform repo = the whole environment (bot App auth;
    #    auto-merged per ADR-028, PR remains as the audit trail).
    - id: open-pr
      name: Open the environment PR
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=nezam-org&repo=nezam-devops-k3s
        branchName: devenv/${{ user.entity.metadata.name }}-${{ parameters.envName }}
        title: 'devenv: add ${{ user.entity.metadata.name }}/${{ parameters.envName }}'
        description: |
          ## New dev environment — audit trail (auto-merged, ADR-028)

          Requested via the developer portal by
          **@${{ user.entity.metadata.name }}** (task 050 flow).

          - Adds `k8s/devenvs/${{ user.entity.metadata.name }}/${{ parameters.envName }}/`
            (namespace, quota, Cilium fence, ns-jailed kubectl RBAC, PVC,
            workspace Deployment 0↔1, HTTPRoute → KEDA interceptor,
            InterceptorRoutes + ScaledObject, sops-sealed workspace-secrets).
          - Size ${{ parameters.size }}, disk ${{ parameters.pvcSize }},
            ssh=${{ parameters.ssh }}, docker=${{ parameters.docker }}
            (docker = sysbox runtime + userns, 050 F1),
            backup=${{ 'yes (user bucket)' if steps['seal-secrets'].output.backupConfigured else 'no' }}.
          - NO GitHub repo, NO database — this is a workspace, not an app.
          - Backup (if any) targets the USER's own S3 bucket — the platform
            stores only the sops-encrypted credentials, never the data.

          Suspends after ~2h with no open connection; wakes on access.
        sourcePath: ./pr

    - id: merge-pr
      name: Deliver via GitOps (auto-merge, ADR-028)
      action: nezam:github:merge-pr
      input:
        owner: nezam-org
        repo: nezam-devops-k3s
        pullNumber: ${{ steps['open-pr'].output.pullRequestNumber }}

    # 5. Register the env in the catalog (Resource/dev-environment — the
    #    close-devenv picker filters on this).
    - id: register
      name: Register in the catalog
      action: catalog:register
      input:
        catalogInfoUrl: https://github.com/nezam-org/nezam-devops-k3s/blob/main/k8s/devenvs/${{ user.entity.metadata.name }}/${{ parameters.envName }}/catalog-info.yaml
        optional: true

  # ---------------------------------------------------------------------------
  # OUTPUT
  # ---------------------------------------------------------------------------
  output:
    text:
      - title: Your workspace (SAVE THE PASSWORD — shown only once)
        content: |
          **Web IDE**: https://${{ user.entity.metadata.name }}-${{ parameters.envName }}-dev.nezam.site

          **Password**: `${{ steps['seal-secrets'].output.webPassword }}`

          (Terminal-first envs: the password is unused — the web URL just
          shows your SSH connection instructions.)

          Flux delivers the environment in ~1-2 minutes; the very first page
          load then boots the workspace (image pull may add a few minutes the
          first time — later wakes take seconds). It suspends after ~2h with
          no open tab/SSH session; your home dir persists on disk.

          **SSH** (if enabled) — install `wstunnel` (v10+) locally, then add
          to `~/.ssh/config`:

              Host ${{ parameters.envName }}.workspace
                HostName localhost
                Port 2222
                User dev
                ProxyCommand wstunnel client --log-lvl=off --http-upgrade-path-prefix _ssh -L stdio://%h:%p wss://${{ user.entity.metadata.name }}-${{ parameters.envName }}-ssh.nezam.site:443

          then: `ssh ${{ parameters.envName }}.workspace` — connecting wakes a
          suspended workspace. Auth = your GitHub keys (github.com/${{ user.entity.metadata.name }}.keys).

          **Backup** → your OWN bucket (${{ parameters.backupBucket if parameters.backupBucket else 'not configured' }}).
          ${{ ('Restic password (SAVE THIS — needed to restore later): `' + steps['seal-secrets'].output.resticPassword + '`') if steps['seal-secrets'].output.resticPassword else '' }}
          When enabled: nightly at 03:00 UTC, on suspend, and via
          `workspace-backup` anytime. Reopen this SAME env name with the SAME
          restic password and it AUTO-RESTORES your home dir on first boot.
          Snapshots are tagged `host=workspace` so they coexist with any other
          data already in your bucket (e.g. a laptop backup) — nothing else is
          touched. If the bucket holds a repo we can't decrypt, we warn and
          disable backups rather than overwrite (see ~/BACKUP-WARNING.txt).
    links:
      - title: Open your workspace (web IDE)
        url: https://${{ user.entity.metadata.name }}-${{ parameters.envName }}-dev.nezam.site
      - title: Environment PR (audit trail — auto-merged, ADR-028)
        url: ${{ steps['open-pr'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
