apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: create-devenv
  title: Request a dev environment
  description: >-
    A personal cloud workspace: VS Code (code-server) in the browser + SSH
    from your terminal, with a real toolchain preinstalled (claude, pi,
    kubectl, k9s, tofu, flux, helm, gh, lazygit, LazyVim, tmux, zsh). Your
    home dir persists on disk; the workspace suspends after ~2h idle and
    wakes on access. NO GitHub repo is created. The image ships the platform
    owner's generic dotfiles as defaults — change anything once inside;
    bring-your-own-dotfiles is planned.
  tags:
    - devenv
    - workspace
spec:
  owner: ma-shaaban
  type: resource

  # ---------------------------------------------------------------------------
  # FORM
  # ---------------------------------------------------------------------------
  parameters:
    - title: Your dev workspace
      required:
        - envName
        - size
        - pvcSize
      properties:
        envName:
          title: Workspace name
          type: string
          description: >-
            Short name (e.g. "main"). Becomes your URLs:
            <you>-<name>-dev.nezam.site (web IDE) and
            <you>-<name>-ssh.nezam.site (SSH). One environment per user.
          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
          maxLength: 16
          default: main
          ui:autofocus: true
        size:
          title: Size
          type: string
          default: M
          enum: [S, M]
          enumNames:
            - 'S — 0.5 vCPU / 1 GiB (light editing)'
            - 'M — 1 vCPU / 2 GiB (recommended)'
          description: >-
            L (2 vCPU / 4 GiB) coming soon — needs more cluster capacity.
          ui:widget: radio
        pvcSize:
          title: Disk (home directory)
          type: string
          default: 10Gi
          enum: [5Gi, 10Gi, 20Gi]
          ui:widget: radio
        extensions:
          title: VS Code extensions (Open VSX)
          description: >-
            Preinstalled at first boot. You can install more inside the IDE —
            they persist on your disk.
          type: array
          uniqueItems: true
          ui:widget: checkboxes
          default:
            - ms-python.python
            - charliermarsh.ruff
            - redhat.vscode-yaml
            - eamodio.gitlens
          items:
            type: string
            enum:
              - ms-python.python
              - charliermarsh.ruff
              - dbaeumer.vscode-eslint
              - esbenp.prettier-vscode
              - redhat.vscode-yaml
              - ms-azuretools.vscode-docker
              - eamodio.gitlens
              - golang.go
              - rust-lang.rust-analyzer
              - ms-toolsai.jupyter
        ssh:
          title: Enable SSH access
          type: boolean
          default: true
          description: >-
            SSH from your own terminal, tunneled over 443 — auth via your
            GitHub public keys (github.com/<you>.keys must be non-empty).
            Connecting auto-wakes a suspended workspace.
        backup:
          title: Nightly backup to Backblaze B2 (+ devbox-backup/devbox-restore)
          type: boolean
          default: true
          description: >-
            IMPORTANT — workspace disk is pinned to one server node; without
            backup, losing that node loses your home dir. Backup also enables
            the close → re-request → devbox-restore workflow.

  # ---------------------------------------------------------------------------
  # STEPS
  # ---------------------------------------------------------------------------
  steps:
    # 0. ONE env per user (050 D5) — server-side against the LIVE platform
    #    tree; the form/catalog can't be trusted for this.
    - id: assert-single-env
      name: Check you have no existing environment
      action: nezam:devenv:assert-none
      input:
        user: ${{ user.entity.metadata.name }}

    # 1. Fetch the devenv skeleton VERBATIM from the platform repo (literal
    #    __TOKENS__, fetch:plain does not run nunjucks on contents). Read via
    #    the bot App integration. Everything under ./pr lands at the platform
    #    repo root in one PR.
    - id: fetch-skeleton
      name: Fetch the devenv skeleton
      action: fetch:plain
      input:
        url: https://github.com/nezam-org/nezam-devops-k3s/tree/main/templates/devenv
        targetPath: ./pr/k8s/devenvs/${{ user.entity.metadata.name }}/${{ parameters.envName }}

    # 2. Stamp it. Size presets map inline (S: 100m/500m/512Mi/1Gi,
    #    M: 250m/1/1Gi/2Gi — 050 §4). The image tag is pinned here and bumped
    #    on devbox-image releases.
    - id: personalise
      name: Personalise the environment
      action: nezam:fs:replace
      input:
        globPattern: pr/**/*
        replacements:
          - find: __NAMESPACE__
            replaceWith: ${{ user.entity.metadata.name }}-${{ parameters.envName }}-dev
          - find: __USER__
            replaceWith: ${{ user.entity.metadata.name }}
          - find: __ENV__
            replaceWith: ${{ parameters.envName }}
          - find: __CPU_REQUEST__
            replaceWith: ${{ '100m' if parameters.size == 'S' else '250m' }}
          - find: __CPU_LIMIT__
            replaceWith: ${{ '500m' if parameters.size == 'S' else '1' }}
          - find: __MEM_REQUEST__
            replaceWith: ${{ '512Mi' if parameters.size == 'S' else '1Gi' }}
          - find: __MEM_LIMIT__
            replaceWith: ${{ '1Gi' if parameters.size == 'S' else '2Gi' }}
          - find: __PVC_SIZE__
            replaceWith: ${{ parameters.pvcSize }}
          - find: __IMAGE_TAG__
            replaceWith: main-20a8c77
          - find: __EXTENSIONS__
            replaceWith: ${{ parameters.extensions | join(' ') }}
          - find: __SSH_ENABLED__
            replaceWith: ${{ parameters.ssh }}
          - find: __BACKUP_ENABLED__
            replaceWith: ${{ parameters.backup }}

    # 3. Generate + seal the env secrets (050 D15, ADR-027): web password is
    #    argon2id-hashed for code-server; plaintext appears ONLY in this run's
    #    output page. B2 creds come from the backstage env (shared devenvs
    #    key — never the DR keys).
    - id: seal-secrets
      name: Generate the workspace credentials (encrypted)
      action: nezam:devenv:seal-secrets
      input:
        user: ${{ user.entity.metadata.name }}
        env: ${{ parameters.envName }}
        namespace: ${{ user.entity.metadata.name }}-${{ parameters.envName }}-dev
        ageRecipient: age14w6krfhmhpdfysedvennwf63d04ffp2w9h0uap3ax02xkrz4zcmq9hsmt0
        secretsPath: pr/k8s/devenvs/${{ user.entity.metadata.name }}/${{ parameters.envName }}/secrets.sops.yaml

    # 4. One PR onto the platform repo = the whole environment (bot App auth;
    #    auto-merged per ADR-028, PR remains as the audit trail).
    - id: open-pr
      name: Open the environment PR
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=nezam-org&repo=nezam-devops-k3s
        branchName: devenv/${{ user.entity.metadata.name }}-${{ parameters.envName }}
        title: 'devenv: add ${{ user.entity.metadata.name }}/${{ parameters.envName }}'
        description: |
          ## New dev environment — audit trail (auto-merged, ADR-028)

          Requested via the developer portal by
          **@${{ user.entity.metadata.name }}** (task 050 flow).

          - Adds `k8s/devenvs/${{ user.entity.metadata.name }}/${{ parameters.envName }}/`
            (namespace, quota, Cilium fence, ns-jailed kubectl RBAC, PVC,
            devbox Deployment 0↔1, HTTPRoute → KEDA interceptor,
            InterceptorRoutes + ScaledObject, sops-sealed devbox-secrets).
          - Size ${{ parameters.size }}, disk ${{ parameters.pvcSize }},
            ssh=${{ parameters.ssh }}, backup=${{ parameters.backup }}.
          - NO GitHub repo, NO database — this is a workspace, not an app.

          Suspends after ~2h with no open connection; wakes on access.
        sourcePath: ./pr

    - id: merge-pr
      name: Deliver via GitOps (auto-merge, ADR-028)
      action: nezam:github:merge-pr
      input:
        owner: nezam-org
        repo: nezam-devops-k3s
        pullNumber: ${{ steps['open-pr'].output.pullRequestNumber }}

    # 5. Register the env in the catalog (Resource/dev-environment — the
    #    close-devenv picker filters on this).
    - id: register
      name: Register in the catalog
      action: catalog:register
      input:
        catalogInfoUrl: https://github.com/nezam-org/nezam-devops-k3s/blob/main/k8s/devenvs/${{ user.entity.metadata.name }}/${{ parameters.envName }}/catalog-info.yaml
        optional: true

  # ---------------------------------------------------------------------------
  # OUTPUT
  # ---------------------------------------------------------------------------
  output:
    text:
      - title: Your workspace (SAVE THE PASSWORD — shown only once)
        content: |
          **Web IDE**: https://${{ user.entity.metadata.name }}-${{ parameters.envName }}-dev.nezam.site

          **Password**: `${{ steps['seal-secrets'].output.webPassword }}`

          Flux delivers the environment in ~1-2 minutes; the very first page
          load then boots the workspace (image pull may add a few minutes the
          first time — later wakes take seconds). It suspends after ~2h with
          no open tab/SSH session; your home dir persists on disk.

          **SSH** (if enabled) — install `wstunnel` (v10+) locally, then add
          to `~/.ssh/config`:

              Host ${{ parameters.envName }}.devbox
                HostName localhost
                Port 2222
                User dev
                ProxyCommand wstunnel client --log-lvl=off --http-upgrade-path-prefix _ssh -L stdio://%h:%p wss://${{ user.entity.metadata.name }}-${{ parameters.envName }}-ssh.nezam.site:443

          then: `ssh ${{ parameters.envName }}.devbox` — connecting wakes a
          suspended workspace. Auth = your GitHub keys (github.com/${{ user.entity.metadata.name }}.keys).

          **Backup** (if enabled): nightly at 03:00 UTC while awake, plus
          `devbox-backup` anytime. After closing an env you can request a new
          one and run `devbox-restore` to get your home dir back.
    links:
      - title: Open your workspace (web IDE)
        url: https://${{ user.entity.metadata.name }}-${{ parameters.envName }}-dev.nezam.site
      - title: Environment PR (audit trail — auto-merged, ADR-028)
        url: ${{ steps['open-pr'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
